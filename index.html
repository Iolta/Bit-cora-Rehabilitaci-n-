<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bitácora Rehab">
<title>BITÁCORA · REHABILITACIÓN</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#111111; --card:#1e1e1e; --card2:#252525; --border:#2e2e2e;
  --text:#ffffff; --muted:#777777; --muted2:#444444;
  --green:#4ade80; --green-dim:#14532d;
  --yellow:#facc15; --blue:#60a5fa; --blue-dim:#1e3a5f;
  --purple:#c084fc; --orange:#fb923c; --red:#f87171;
  --radius:14px;
}
html,body { height:100%; }
body {
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh; max-width:480px; margin:0 auto;
  display:flex; flex-direction:column; overflow-x:hidden;
}

/* HEADER */
header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 16px 13px; border-bottom:1px solid var(--border);
  position:sticky; top:0; background:var(--bg); z-index:200;
}
header .ico { font-size:22px; }
header h1 { font-size:13px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; }
.btn-cfg {
  background:var(--card); border:1px solid var(--border);
  border-radius:9px; padding:6px 10px; font-size:18px; cursor:pointer;
}

/* NAV */
nav {
  display:flex; border-bottom:1px solid var(--border);
  position:sticky; top:57px; background:var(--bg); z-index:190;
}
nav button {
  flex:1; background:none; border:none; color:var(--muted);
  padding:12px 4px; font-size:11px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
  border-bottom:2px solid transparent; transition:all .2s;
}
nav button.active { color:var(--text); border-bottom-color:var(--green); }

/* MAIN */
main { flex:1; padding:16px; display:flex; flex-direction:column; gap:14px; }

/* SEC TITLE */
.sec-title {
  font-size:11px; font-weight:600; letter-spacing:.15em;
  text-transform:uppercase; color:var(--muted); margin-bottom:4px;
}

/* CARD */
.card {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px;
}

/* SPEC GRID */
.spec-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.spec-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:18px 12px;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  cursor:pointer; transition:all .15s; user-select:none; text-align:center;
}
.spec-card:active { transform:scale(.97); background:var(--card2); }
.spec-card .spec-ico { font-size:28px; }
.spec-card .spec-name { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
.spec-card .spec-count { font-size:11px; color:var(--muted); }
.spec-card.active-spec { border-width:2px; }

.spec-kine   { border-color:#60a5fa33; } .spec-kine.active-spec   { border-color:var(--blue); }
.spec-fono   { border-color:#4ade8033; } .spec-fono.active-spec   { border-color:var(--green); }
.spec-to     { border-color:#c084fc33; } .spec-to.active-spec     { border-color:var(--purple); }
.spec-enf    { border-color:#facc1533; } .spec-enf.active-spec    { border-color:var(--yellow); }
.spec-cir    { border-color:#f8717133; } .spec-cir.active-spec    { border-color:var(--red); }
.spec-nut    { border-color:#fb923c33; } .spec-nut.active-spec    { border-color:var(--orange); }
.spec-med    { border-color:#e2e8f033; } .spec-med.active-spec    { border-color:#e2e8f0; }

/* STATS */
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px 14px;
  display:flex; flex-direction:column; gap:4px;
}
.stat-label { font-size:10px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
.stat-value { font-size:24px; font-weight:700; }
.stat-sub { font-size:11px; color:var(--muted); }

/* LOG */
.log-list { display:flex; flex-direction:column; gap:8px; }
.log-item {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px 16px;
  display:flex; align-items:flex-start; gap:12px;
}
.log-ico { font-size:22px; flex-shrink:0; margin-top:2px; }
.log-body { flex:1; display:flex; flex-direction:column; gap:3px; }
.log-head { display:flex; justify-content:space-between; align-items:center; }
.log-spec { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
.log-time { font-size:11px; color:var(--muted); }
.log-prof { font-size:13px; font-weight:600; }
.log-action { font-size:12px; color:var(--muted); }
.log-dur { font-size:12px; color:var(--green); font-weight:600; }
.log-notes { font-size:12px; color:var(--muted); font-style:italic; margin-top:6px; border-top:1px solid var(--border); padding-top:6px; }
.log-delete { background:none; border:none; color:var(--muted2); font-size:20px; cursor:pointer; padding:2px 4px; flex-shrink:0; }

/* PROGRESS */
.progress-row { display:flex; flex-direction:column; gap:10px; }
.prog-item { display:flex; flex-direction:column; gap:4px; }
.prog-head { display:flex; justify-content:space-between; }
.prog-name { font-size:12px; font-weight:600; }
.prog-val { font-size:12px; color:var(--muted); }
.prog-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.prog-fill { height:100%; border-radius:3px; transition:width .4s ease; }

/* EMPTY */
.empty-state { text-align:center; color:var(--muted); padding:40px 20px; font-size:13px; line-height:1.8; }
.empty-ico { font-size:40px; margin-bottom:12px; }

/* OVERLAY / MODAL */
.overlay {
  position:fixed; inset:0; background:#000000cc;
  z-index:500; display:flex; align-items:flex-end;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.overlay.open { opacity:1; pointer-events:all; }
.modal {
  background:#1a1a1a; border:1px solid var(--border);
  border-radius:20px 20px 0 0; width:100%; max-width:480px;
  margin:0 auto; padding:24px 20px 40px;
  transform:translateY(100%); transition:transform .3s ease;
  max-height:90vh; overflow-y:auto;
  display:flex; flex-direction:column; gap:14px;
}
.overlay.open .modal { transform:translateY(0); }
.modal-handle { width:40px; height:4px; background:var(--border); border-radius:2px; margin:0 auto -4px; }
.modal-title { font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; text-align:center; padding-bottom:8px; border-bottom:1px solid var(--border); }

/* FORM */
label { font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
select, input, textarea {
  background:var(--card); border:1px solid var(--border);
  border-radius:10px; color:var(--text); padding:13px 14px;
  font-size:15px; width:100%; font-family:inherit; outline:none;
  transition:border-color .15s; appearance:none;
}
select:focus, input:focus, textarea:focus { border-color:var(--green); }
textarea { resize:none; min-height:80px; }
select option { background:#1e1e1e; }

.pill-row { display:flex; flex-wrap:wrap; gap:8px; }
.pill {
  background:var(--card); border:1px solid var(--border);
  border-radius:20px; padding:7px 14px; font-size:12px; font-weight:600;
  cursor:pointer; transition:all .15s; white-space:nowrap; user-select:none;
}
.pill.sel { background:var(--green); border-color:var(--green); color:#000; }
.pill:active { transform:scale(.95); }

.btn-primary {
  background:var(--green); color:#000; border:none; border-radius:12px;
  padding:15px; font-size:14px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; cursor:pointer; width:100%;
}
.btn-primary:active { opacity:.8; }
.btn-secondary {
  background:var(--card); color:var(--text); border:1px solid var(--border);
  border-radius:12px; padding:13px; font-size:13px; font-weight:600;
  cursor:pointer; width:100%;
}

/* CONFIG */
.cfg-spec-block { display:flex; flex-direction:column; gap:8px; }
.cfg-spec-title { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border); padding-bottom:6px; }
.cfg-prof-list { display:flex; flex-direction:column; gap:6px; }
.cfg-prof-row { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 14px; }
.cfg-prof-name { flex:1; font-size:14px; }
.cfg-prof-del { background:none; border:none; color:var(--muted2); font-size:20px; cursor:pointer; }
.cfg-add-row { display:flex; gap:8px; }
.cfg-add-row input { flex:1; }
.cfg-add-btn { background:var(--green); color:#000; border:none; border-radius:10px; padding:0 18px; font-size:22px; font-weight:700; cursor:pointer; flex-shrink:0; }
</style>
</head>
<body>

<header>
  <span class="ico">🫁</span>
  <h1>Bitácora · Rehab</h1>
  <button class="btn-cfg" onclick="openConfig()">⚙️</button>
</header>

<nav>
  <button class="active" onclick="switchTab('hoy',this)">Hoy</button>
  <button onclick="switchTab('nueva',this)">+ Sesión</button>
  <button onclick="switchTab('historial',this)">Historial</button>
  <button onclick="switchTab('resumen',this)">Resumen</button>
</nav>

<main id="app"></main>

<input type="file" id="import-input" accept=".csv" style="display:none" onchange="procesarCSV(event)">

<div class="overlay" id="modal-spec">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">¿Con qué especialidad?</div>
    <div class="spec-grid" id="spec-grid-picker"></div>
    <button class="btn-secondary" onclick="closeModal('modal-spec')">Cancelar</button>
  </div>
</div>

<div class="overlay" id="modal-detalle">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-detalle-title">Historial</div>
    <div id="modal-detalle-content" class="log-list" style="margin-bottom: 14px;"></div>
    <button class="btn-secondary" onclick="closeModal('modal-detalle')">Cerrar</button>
  </div>
</div>

<div class="overlay" id="modal-sesion">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-sesion-title">Nueva Sesión</div>

    <label>Profesionales</label>
    <div class="pill-row" id="prof-pills"></div>

    <label>Acción / Actividad · seleccioná una o más</label>
    <div class="pill-row" id="action-pills"></div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <input id="custom-action" placeholder="Nueva acción (escribir y agregar)…" style="flex:1">
      <button onclick="agregarAccionPersonalizada()" style="background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:0 14px;font-size:18px;cursor:pointer;flex-shrink:0">+</button>
    </div>

    <label>Duración</label>
    <div class="pill-row" id="dur-pills">
      <span class="pill" onclick="selDur(this,'5')">5 min</span>
      <span class="pill" onclick="selDur(this,'10')">10 min</span>
      <span class="pill" onclick="selDur(this,'15')">15 min</span>
      <span class="pill" onclick="selDur(this,'20')">20 min</span>
      <span class="pill" onclick="selDur(this,'30')">30 min</span>
      <span class="pill" onclick="selDur(this,'45')">45 min</span>
      <span class="pill" onclick="selDur(this,'60')">60 min</span>
    </div>
    <input type="number" id="custom-dur" placeholder="Otra duración en minutos…" min="1" max="480">

    <label>Notas (opcional)</label>
    <textarea id="session-notes" placeholder="Observaciones, tolerancia, evolución…"></textarea>

    <button class="btn-primary" onclick="guardarSesion()">GUARDAR SESIÓN</button>
    <button class="btn-secondary" onclick="closeModal('modal-sesion')">Cancelar</button>
  </div>
</div>

<div class="overlay" id="modal-config">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Configuración</div>
    
    <div class="sec-title" style="color:var(--blue)">Respaldo de Datos</div>
    <button class="btn-secondary" onclick="document.getElementById('import-input').click()" style="margin-bottom:20px; border-color:var(--blue)">
        📥 Restaurar desde archivo CSV
    </button>

    <div class="sec-title">Profesionales por Especialidad</div>
    <div id="config-content" style="display:flex;flex-direction:column;gap:20px"></div>
    <button class="btn-primary" onclick="closeModal('modal-config')">LISTO</button>
  </div>
</div>

<script>
/* ─── ESPECIALIDADES ─── */
const SPECS = [
  { id:'kine',  nombre:'Kinesiología',       ico:'🦵', css:'spec-kine',  color:'#60a5fa',
    acciones:['Ejercicios respiratorios','Movilización pasiva','Movilización activa','Aspiración de secreciones','Fisioterapia torácica','Control de cuff','Deambulación asistida','Técnica de tos asistida'] },
  { id:'fono',  nombre:'Fonoaudiología',      ico:'🗣️', css:'spec-fono',  color:'#4ade80',
    acciones:['Evaluación de deglución','Ejercicios vocales','Práctica con válvula','Técnica de habla esofágica','Estimulación oral','Control de mascarilla','Higiene oral','Deglución con cánula'] },
  { id:'to',    nombre:'Terapia Ocupacional', ico:'🖐️', css:'spec-to',    color:'#c084fc',
    acciones:['Evaluación funcional','Actividades de vida diaria','Entrenamiento fino','Adaptación del entorno','Ejercicios de mano','Conservación de energía','Uso de dispositivos adaptativos'] },
  { id:'enf',   nombre:'Enfermería',          ico:'💉', css:'spec-enf',   color:'#facc15',
    acciones:['Curación traqueotomía','Aspiración de secreciones','Cambio de cánula','Signos vitales','Administración de medicación','Higiene general','Control de herida quirúrgica','Humidificación'] },
  { id:'cir',   nombre:'Cirugía',             ico:'🏥', css:'spec-cir',   color:'#f87171',
    acciones:['Revisión de herida','Indicaciones post-op','Control de evolución','Ajuste de tratamiento','Consulta de urgencia','Planificación próxima etapa','Evaluación de decanulación'] },
  { id:'nut',   nombre:'Nutrición',            ico:'🥗', css:'spec-nut',   color:'#fb923c',
    acciones:['Evaluación nutricional','Plan alimentario','Control de peso','Ajuste de dieta','Evaluación de deglución segura','Suplementación','Control de hidratación'] },
  { id:'med',   nombre:'Medicina General',     ico:'🩺', css:'spec-med',   color:'#e2e8f0',
    acciones:['Consulta de evolución','Control de signos vitales','Ajuste de medicación','Evaluación respiratoria','Indicaciones generales','Alta parcial','Interconsulta'] },
];

/* ─── ESTADO ─── */
let sesiones = [];
let profesionales = {};
let accionesPersonalizadas = {};
let specActual = null;
let durActual = null;

// Cronómetro de Tapón
let taponInicio = localStorage.getItem('rehab_tapon_inicio') || null;
let taponInterval = null;

function cargar() {
  try {
    const raw = localStorage.getItem('rehab_bitacora_v1');
    if (raw) {
      const d = JSON.parse(raw);
      sesiones = d.sesiones || [];
      profesionales = d.profesionales || {};
      accionesPersonalizadas = d.accionesPersonalizadas || {};
    }
  } catch(e) {}
  SPECS.forEach(e => {
    if (!profesionales[e.id]) profesionales[e.id] = [];
    if (!accionesPersonalizadas[e.id]) accionesPersonalizadas[e.id] = [];
  });
}

function guardar() {
  localStorage.setItem('rehab_bitacora_v1', JSON.stringify({ sesiones, profesionales, accionesPersonalizadas }));
}

/* ─── IMPORTAR CSV ─── */
function procesarCSV(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const text = e.target.result;
        const lines = text.split(/\r?\n/);
        if (lines.length < 2) return;

        let nuevosRegistros = 0;
        
        // Saltamos la cabecera (i=1)
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            
            // Regex para manejar comas dentro de comillas
            const row = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
            if (!row || row.length < 6) continue;

            // Limpiamos comillas
            const clean = row.map(v => v.replace(/^"|"$/g, ''));
            
            // Mapeo: [Fecha, Hora, Especialidad, Profesionales, Acciones, Duración, Notas]
            const [fecha, hora, especNombre, profsRaw, accion, dur, notas] = clean;

            // Encontrar el ID de especialidad por nombre
            const spec = SPECS.find(s => s.nombre === especNombre);
            if (!spec) continue;

            // Evitar duplicados exactos
            const existe = sesiones.find(s => s.fecha === fecha && s.hora === hora && s.especId === spec.id);
            if (existe) continue;

            // Reconstruir lista de profesionales
            const listaProfs = profsRaw.split(' / ').map(p => p.trim()).filter(p => p);

            sesiones.push({
                id: Date.now() + i, // ID único temporal
                fecha: fecha,
                hora: hora,
                especId: spec.id,
                profesionales: listaProfs,
                accion: accion,
                duracion: parseInt(dur) || 0,
                notas: notas || null
            });
            nuevosRegistros++;
        }

        if (nuevosRegistros > 0) {
            guardar();
            alert(`¡Éxito! Se han restaurado ${nuevosRegistros} sesiones.`);
            render();
        } else {
            alert('No se encontraron registros nuevos para importar en este archivo.');
        }
        event.target.value = ''; // Limpiar input
    };
    reader.readAsText(file);
}

/* ─── CRONÓMETRO TAPÓN ─── */
function updateTaponDisplay() {
  if (!taponInicio || tabActual !== 'hoy') return;
  const now = Date.now();
  const diff = now - parseInt(taponInicio);
  const totalSegundos = Math.floor(diff / 1000);
  const h = Math.floor(totalSegundos / 3600);
  const m = Math.floor((totalSegundos % 3600) / 60);
  const s = totalSegundos % 60;

  const timeStr = (h > 0 ? String(h).padStart(2,'0')+':' : '') +
                  String(m).padStart(2,'0') + ':' +
                  String(s).padStart(2,'0');

  const elTime = document.getElementById('tapon-time');
  if (elTime) elTime.textContent = timeStr;
}

function toggleTapon() {
  if (taponInicio) {
    const diffMin = Math.max(1, Math.round((Date.now() - parseInt(taponInicio)) / 60000));
    if (confirm(`¿Finalizar prueba de tapón? Se registrará una sesión de ${diffMin} minutos.`)) {
      sesiones.push({
        id: Date.now(),
        fecha: keyHoy(),
        hora: new Date().toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'}),
        especId: 'fono',
        profesionales: ['Registro Automático'],
        accion: 'Entrenamiento con cánula tapada',
        duracion: diffMin,
        notas: 'Prueba de tolerancia cronometrada.'
      });
      guardar();
      taponInicio = null;
      localStorage.removeItem('rehab_tapon_inicio');
      clearInterval(taponInterval);
      render();
    }
  } else {
    taponInicio = Date.now();
    localStorage.setItem('rehab_tapon_inicio', taponInicio);
    render();
    taponInterval = setInterval(updateTaponDisplay, 1000);
    updateTaponDisplay();
  }
}

/* ─── TAB ─── */
let tabActual = 'hoy';
function switchTab(tab, btn) {
  tabActual = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (tab === 'nueva') { abrirSelectorSpec(); return; }
  render();
}

function render() {
  const app = document.getElementById('app');
  if (tabActual === 'hoy') {
    app.innerHTML = vistaHoy();
    if (taponInicio) updateTaponDisplay();
  }
  if (tabActual === 'historial') app.innerHTML = vistaHistorial();
  if (tabActual === 'resumen')   app.innerHTML = vistaResumen();
}

/* ─── VISTA HOY ─── */
function vistaHoy() {
  const hoy = keyHoy();
  const sesHoy = sesiones.filter(s => s.fecha === hoy);
  const totalMin = sesHoy.reduce((a,s) => a + (parseInt(s.duracion)||0), 0);

  const d = new Date();
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses = ['enero','

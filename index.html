<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bitácora Rehab">
<title>BITÁCORA · REHABILITACIÓN</title>

<link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Bit%C3%A1cora%20Rehab%22%2C%22short_name%22%3A%22Rehab%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23111111%22%2C%22theme_color%22%3A%22%23111111%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%AB%81%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D'>

<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#111111; --card:#1e1e1e; --card2:#252525; --border:#2e2e2e;
  --text:#ffffff; --muted:#777777; --muted2:#444444;
  --green:#4ade80; --green-dim:#14532d;
  --yellow:#facc15; --blue:#60a5fa; --blue-dim:#1e3a5f;
  --purple:#c084fc; --orange:#fb923c; --red:#f87171;
  --radius:14px;
}
html,body { height:100%; }
body {
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh; max-width:480px; margin:0 auto;
  display:flex; flex-direction:column; overflow-x:hidden;
}

/* HEADER */
header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 16px 13px; border-bottom:1px solid var(--border);
  position:sticky; top:0; background:var(--bg); z-index:200;
}
header .ico { font-size:22px; }
header h1 { font-size:13px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; }
.btn-cfg {
  background:var(--card); border:1px solid var(--border);
  border-radius:9px; padding:6px 10px; font-size:18px; cursor:pointer;
}

/* NAV */
nav {
  display:flex; border-bottom:1px solid var(--border);
  position:sticky; top:57px; background:var(--bg); z-index:190;
}
nav button {
  flex:1; background:none; border:none; color:var(--muted);
  padding:12px 4px; font-size:11px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
  border-bottom:2px solid transparent; transition:all .2s;
}
nav button.active { color:var(--text); border-bottom-color:var(--green); }

/* MAIN */
main { flex:1; padding:16px; display:flex; flex-direction:column; gap:14px; }

/* SEC TITLE */
.sec-title {
  font-size:11px; font-weight:600; letter-spacing:.15em;
  text-transform:uppercase; color:var(--muted); margin-bottom:4px;
}

/* CARD */
.card {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px;
}

/* SPEC GRID */
.spec-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.spec-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:18px 12px;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  cursor:pointer; transition:all .15s; user-select:none; text-align:center;
}
.spec-card:active { transform:scale(.97); background:var(--card2); }
.spec-card .spec-ico { font-size:28px; }
.spec-card .spec-name { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
.spec-card .spec-count { font-size:11px; color:var(--muted); }
.spec-card.active-spec { border-width:2px; }

.spec-kine   { border-color:#60a5fa33; } .spec-kine.active-spec   { border-color:var(--blue); }
.spec-fono   { border-color:#4ade8033; } .spec-fono.active-spec   { border-color:var(--green); }
.spec-to     { border-color:#c084fc33; } .spec-to.active-spec     { border-color:var(--purple); }
.spec-enf    { border-color:#facc1533; } .spec-enf.active-spec    { border-color:var(--yellow); }
.spec-cir    { border-color:#f8717133; } .spec-cir.active-spec    { border-color:var(--red); }
.spec-nut    { border-color:#fb923c33; } .spec-nut.active-spec    { border-color:var(--orange); }
.spec-med    { border-color:#e2e8f033; } .spec-med.active-spec    { border-color:#e2e8f0; }

/* STATS */
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px 14px;
  display:flex; flex-direction:column; gap:4px;
}
.stat-label { font-size:10px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
.stat-value { font-size:24px; font-weight:700; }
.stat-sub { font-size:11px; color:var(--muted); }

/* LOG */
.log-list { display:flex; flex-direction:column; gap:8px; }
.log-item {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px 16px;
  display:flex; align-items:flex-start; gap:12px;
}
.log-ico { font-size:22px; flex-shrink:0; margin-top:2px; }
.log-body { flex:1; display:flex; flex-direction:column; gap:3px; }
.log-head { display:flex; justify-content:space-between; align-items:center; }
.log-spec { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
.log-time { font-size:11px; color:var(--muted); }
.log-prof { font-size:13px; font-weight:600; }
.log-action { font-size:12px; color:var(--muted); }
.log-dur { font-size:12px; color:var(--green); font-weight:600; }
.log-notes { font-size:12px; color:var(--muted); font-style:italic; margin-top:6px; border-top:1px solid var(--border); padding-top:6px; }
.log-delete { background:none; border:none; color:var(--muted2); font-size:20px; cursor:pointer; padding:2px 4px; flex-shrink:0; }

/* PROGRESS */
.progress-row { display:flex; flex-direction:column; gap:10px; }
.prog-item { display:flex; flex-direction:column; gap:4px; }
.prog-head { display:flex; justify-content:space-between; }
.prog-name { font-size:12px; font-weight:600; }
.prog-val { font-size:12px; color:var(--muted); }
.prog-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.prog-fill { height:100%; border-radius:3px; transition:width .4s ease; }

/* EMPTY */
.empty-state { text-align:center; color:var(--muted); padding:40px 20px; font-size:13px; line-height:1.8; }
.empty-ico { font-size:40px; margin-bottom:12px; }

/* OVERLAY / MODAL */
.overlay {
  position:fixed; inset:0; background:#000000cc;
  z-index:500; display:flex; align-items:flex-end;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.overlay.open { opacity:1; pointer-events:all; }
.modal {
  background:#1a1a1a; border:1px solid var(--border);
  border-radius:20px 20px 0 0; width:100%; max-width:480px;
  margin:0 auto; padding:24px 20px 40px;
  transform:translateY(100%); transition:transform .3s ease;
  max-height:90vh; overflow-y:auto;
  display:flex; flex-direction:column; gap:14px;
}
.overlay.open .modal { transform:translateY(0); }
.modal-handle { width:40px; height:4px; background:var(--border); border-radius:2px; margin:0 auto -4px; }
.modal-title { font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; text-align:center; padding-bottom:8px; border-bottom:1px solid var(--border); }

/* FORM */
label { font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
select, input[type="text"], input[type="number"], input[type="url"], textarea {
  background:var(--card); border:1px solid var(--border);
  border-radius:10px; color:var(--text); padding:13px 14px;
  font-size:15px; width:100%; font-family:inherit; outline:none;
  transition:border-color .15s; appearance:none;
}
select:focus, input:focus, textarea:focus { border-color:var(--green); }
textarea { resize:none; min-height:80px; }
select option { background:#1e1e1e; }

.pill-row { display:flex; flex-wrap:wrap; gap:8px; }
.pill {
  background:var(--card); border:1px solid var(--border);
  border-radius:20px; padding:7px 14px; font-size:12px; font-weight:600;
  cursor:pointer; transition:all .15s; white-space:nowrap; user-select:none;
}
.pill.sel { background:var(--green); border-color:var(--green); color:#000; }
.pill:active { transform:scale(.95); }

.btn-primary {
  background:var(--green); color:#000; border:none; border-radius:12px;
  padding:15px; font-size:14px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; cursor:pointer; width:100%;
}
.btn-primary:active { opacity:.8; }
.btn-secondary {
  background:var(--card); color:var(--text); border:1px solid var(--border);
  border-radius:12px; padding:13px; font-size:13px; font-weight:600;
  cursor:pointer; width:100%;
}

/* CONFIG */
.cfg-spec-block { display:flex; flex-direction:column; gap:8px; }
.cfg-spec-title { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border); padding-bottom:6px; }
.cfg-prof-list { display:flex; flex-direction:column; gap:6px; }
.cfg-prof-row { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 14px; }
.cfg-prof-name { flex:1; font-size:14px; }
.cfg-prof-del { background:none; border:none; color:var(--muted2); font-size:20px; cursor:pointer; }
.cfg-add-row { display:flex; gap:8px; }
.cfg-add-row input { flex:1; }
.cfg-add-btn { background:var(--green); color:#000; border:none; border-radius:10px; padding:0 18px; font-size:22px; font-weight:700; cursor:pointer; flex-shrink:0; }
</style>
</head>
<body>

<header>
  <span class="ico">🫁</span>
  <h1>Bitácora · Rehab</h1>
  <button class="btn-cfg" onclick="openConfig()">⚙️</button>
</header>

<nav>
  <button class="active" onclick="switchTab('hoy',this)">Hoy</button>
  <button onclick="switchTab('nueva',this)">+ Sesión</button>
  <button onclick="switchTab('historial',this)">Historial</button>
  <button onclick="switchTab('resumen',this)">Resumen</button>
</nav>

<main id="app"></main>

<input type="file" id="import-input" style="display:none" onchange="procesarCSV(event)">

<div class="overlay" id="modal-spec">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">¿Con qué especialidad?</div>
    <div class="spec-grid" id="spec-grid-picker"></div>
    <button class="btn-secondary" onclick="closeModal('modal-spec')">Cancelar</button>
  </div>
</div>

<div class="overlay" id="modal-detalle">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-detalle-title">Historial</div>
    <div id="modal-detalle-content" class="log-list" style="margin-bottom: 14px;"></div>
    <button class="btn-secondary" onclick="closeModal('modal-detalle')">Cerrar</button>
  </div>
</div>

<div class="overlay" id="modal-sesion">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-sesion-title">Nueva Sesión</div>
    <label>Profesionales</label>
    <div class="pill-row" id="prof-pills"></div>
    <label>Acción / Actividad</label>
    <div class="pill-row" id="action-pills"></div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <input type="text" id="custom-action" placeholder="Nueva acción…">
      <button onclick="agregarAccionPersonalizada()">+</button>
    </div>
    <label>Duración</label>
    <div class="pill-row" id="dur-pills">
      <span class="pill" onclick="selDur(this,'5')">5m</span>
      <span class="pill" onclick="selDur(this,'15')">15m</span>
      <span class="pill" onclick="selDur(this,'30')">30m</span>
      <span class="pill" onclick="selDur(this,'60')">1h</span>
      <span class="pill" onclick="selDur(this,'120')">2h</span>
    </div>
    <input type="number" id="custom-dur" placeholder="Minutos...">
    <label>Notas</label>
    <textarea id="session-notes"></textarea>
    <button class="btn-primary" onclick="guardarSesion()">GUARDAR SESIÓN</button>
    <button class="btn-secondary" onclick="closeModal('modal-sesion')">Cancelar</button>
  </div>
</div>

<div class="overlay" id="modal-config">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Configuración</div>
    <button class="btn-secondary" onclick="document.getElementById('import-input').click()">📥 Restaurar CSV</button>
    <div style="background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin:10px 0;">
      <label style="display:flex; align-items:center; gap:10px; color:var(--text); text-transform:none;">
        <input type="checkbox" id="cloud-toggle" onchange="toggleCloudSync()"> Google Sheets Sync
      </label>
      <div id="cloud-url-container" style="display:none; margin-top:10px;">
        <input type="url" id="cloud-url" placeholder="Link de Web App..." oninput="saveCloudUrl()">
      </div>
    </div>
    <div id="config-content"></div>
    <button class="btn-primary" onclick="closeModal('modal-config')">LISTO</button>
  </div>
</div>

<script>
/* ─── CONSTANTES ─── */
const ACTION_TAPON = 'Entrenamiento con cánula tapada';

const SPECS = [
  { id:'kine',  nombre:'Kinesiología',       ico:'🦵', css:'spec-kine',  color:'#60a5fa', acciones:['Ejercicios respiratorios','Movilización activa','Aspiración'] },
  { id:'fono',  nombre:'Fonoaudiología',      ico:'🗣️', css:'spec-fono',  color:'#4ade80', acciones:['Evaluación de deglución','Ejercicios vocales','Válvula fonatoria'] },
  { id:'to',    nombre:'Terapia Ocupacional', ico:'🖐️', css:'spec-to',    color:'#c084fc', acciones:['Actividades vida diaria','Entrenamiento fino'] },
  { id:'enf',   nombre:'Enfermería',          ico:'💉', css:'spec-enf',   color:'#facc15', acciones:['Curación traqueotomía','Signos vitales'] },
  { id:'cir',   nombre:'Cirugía',             ico:'🏥', css:'spec-cir',   color:'#f87171', acciones:['Revisión de herida','Control evolución'] },
  { id:'nut',   nombre:'Nutrición',            ico:'🥗', css:'spec-nut',   color:'#fb923c', acciones:['Plan alimentario','Control peso'] },
  { id:'med',   nombre:'Medicina General',     ico:'🩺', css:'spec-med',   color:'#e2e8f0', acciones:['Consulta evolución','Ajuste medicación'] },
];

/* ─── ESTADO ─── */
let sesiones = [];
let profesionales = {};
let accionesPersonalizadas = {};
let cloudSync = { enabled: false, url: '' };
let specActual = null;
let durActual = null;
let taponInicio = localStorage.getItem('rehab_tapon_inicio') || null;
let taponInterval = null;

/* ─── CARGAR / GUARDAR ─── */
function cargar() {
  try {
    const raw = localStorage.getItem('rehab_bitacora_v1');
    if (raw) {
      const d = JSON.parse(raw);
      sesiones = Array.isArray(d.sesiones) ? d.sesiones : [];
      profesionales = d.profesionales || {};
      accionesPersonalizadas = d.accionesPersonalizadas || {};
      cloudSync = d.cloudSync || { enabled: false, url: '' };
    }
  } catch(e) { sesiones = []; }
  
  sesiones = sesiones.filter(s => s && typeof s === 'object');
  SPECS.forEach(e => {
    if (!profesionales[e.id]) profesionales[e.id] = [];
    if (!accionesPersonalizadas[e.id]) accionesPersonalizadas[e.id] = [];
  });
  guardar();
}

function guardar() {
  localStorage.setItem('rehab_bitacora_v1', JSON.stringify({ sesiones, profesionales, accionesPersonalizadas, cloudSync }));
}

/* ─── NUBE ─── */
function enviarNube(sesion) {
  if (!cloudSync.enabled || !cloudSync.url) return;
  const e = SPECS.find(x => x.id === sesion.especId) || { nombre: 'Desconocida' };
  const payload = {
    fecha: sesion.fecha, hora: sesion.hora, especialidad: (sesion.accion === ACTION_TAPON ? "Prueba de Tapón" : e.nombre),
    profesionales: sesion.profesionales.join(' / '), accion: sesion.accion, duracion: sesion.duracion, notas: sesion.notes || ''
  };
  fetch(cloudSync.url, { method:'POST', mode:'no-cors', body:JSON.stringify(payload) }).catch(e => console.log(e));
}

/* ─── IMPORTAR ─── */
function procesarCSV(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const lines = e.target.result.split(/\r?\n/);
            const separator = lines[0].includes(';') ? ';' : ',';
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                let clean = lines[i].split(separator).map(v => v.replace(/^"|"$/g, '').trim());
                let spec = SPECS.find(s => s.nombre.toLowerCase() === (clean[2]||'').toLowerCase()) || {id:'med'};
                sesiones.push({
                    id: Date.now()+i, fecha: clean[0], hora: clean[1], especId: spec.id,
                    profesionales: (clean[3]||'').split('/').map(p=>p.trim()),
                    accion: clean[4], duracion: parseInt(clean[5])||15, notas: clean[6]||null
                });
            }
            guardar(); render(); alert('Datos restaurados.');
        } catch(err) { alert('Error al leer CSV'); }
    };
    reader.readAsText(file);
}

/* ─── CRONÓMETRO ─── */
function updateTaponDisplay() {
  if (!taponInicio || tabActual !== 'hoy') return;
  const diff = Date.now() - parseInt(taponInicio);
  const s = Math.floor(diff/1000);
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const seg = s%60;
  const txt = (h>0?h+':':'')+String(m).padStart(2,'0')+':'+String(seg).padStart(2,'0');
  const el = document.getElementById('tapon-time'); if(el) el.textContent = txt;
}

function toggleTapon() {
  if (taponInicio) {
    const min = Math.max(1, Math.round((Date.now()-parseInt(taponInicio))/60000));
    if (confirm(`¿Finalizar prueba de tapón de ${formatMin(min)}?`)) {
      const s = {
        id: Date.now(), fecha: keyHoy(), hora: new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}),
        especId: 'fono', profesionales: ['Auto-Registro'], accion: ACTION_TAPON, duracion: min, notas: 'Prueba cronometrada'
      };
      sesiones.push(s); guardar(); enviarNube(s);
      taponInicio = null; localStorage.removeItem('rehab_tapon_inicio');
      clearInterval(taponInterval); render();
    }
  } else {
    taponInicio = Date.now(); localStorage.setItem('rehab_tapon_inicio', taponInicio);
    render(); taponInterval = setInterval(updateTaponDisplay, 1000);
  }
}

/* ─── RENDER ─── */
let tabActual = 'hoy';
function switchTab(t, b) {
  tabActual = t;
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  if(b) b.classList.add('active');
  if(t === 'nueva') { abrirSelectorSpec(); return; }
  render();
}

function render() {
  const app = document.getElementById('app');
  if (tabActual === 'hoy') { app.innerHTML = vistaHoy(); if(taponInicio) updateTaponDisplay(); }
  else if (tabActual === 'historial') app.innerHTML = vistaHistorial();
  else if (tabActual === 'resumen') app.innerHTML = vistaResumen();
}

/* ─── VISTA HOY ─── */
function vistaHoy() {
  const hoy = keyHoy();
  const sesHoy = sesiones.filter(s => s.fecha === hoy);
  
  // FILTRO: Ignoramos el tapón para las estadísticas generales diarias
  const sesHoyRehab = sesHoy.filter(s => s.accion !== ACTION_TAPON);
  const totalMinRehab = sesHoyRehab.reduce((a,s) => a + s.duracion, 0);

  let h = `
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Sesiones Activas</div><div class="stat-value" style="color:var(--green)">${sesHoyRehab.length}</div></div>
    <div class="stat-card"><div class="stat-label">Tiempo Activo</div><div class="stat-value" style="color:var(--blue)">${formatMin(totalMinRehab)}</div></div>
  </div>
  <div class="spec-grid" style="margin-top:14px">`;
  
  SPECS.forEach(e => {
    // Acá sí contamos las sesiones para pintar el cuadradito si hubo actividad
    const cnt = sesHoy.filter(s => s.especId === e.id && s.accion !== ACTION_TAPON).length;
    h += `<div class="spec-card ${e.css} ${cnt>0?'active-spec':''}" onclick="abrirSesion('${e.id}')">
      <div class="spec-ico">${e.ico}</div><div class="spec-name">${e.nombre}</div><div class="spec-count">${cnt>0?cnt+' ses.':'---'}</div>
    </div>`;
  });
  
  h += `<div class="spec-card" onclick="toggleTapon()" style="border-color:${taponInicio?'var(--green)':'var(--border)'}">
    <div class="spec-ico">⏱️</div><div class="spec-name">${taponInicio?'Tapón Activo':'Prueba Tapón'}</div><div class="spec-count" id="tapon-time">00:00</div>
  </div></div>`;
  
  if(sesHoy.length > 0) {
    h += `<div class="sec-title" style="margin-top:14px">Registro de hoy</div>`;
    h += `<div class="log-list">${sesHoy.reverse().map(s=>htmlLogItem(s)).join('')}</div>`;
  }
  return h;
}

/* ─── VISTA HISTORIAL ─── */
function vistaHistorial() {
  const porF = {}; sesiones.forEach(s => { if(!porF[s.fecha]) porF[s.fecha]=[]; porF[s.fecha].push(s); });
  let h = `<button class="btn-secondary" onclick="exportarCSV()">📥 Exportar CSV</button>`;
  Object.keys(porF).sort().reverse().forEach(f => {
    // FILTRO: Solo sumamos minutos de sesiones que NO son tapón para el encabezado del día
    const activasDelDia = porF[f].filter(s => s.accion !== ACTION_TAPON);
    const t = activasDelDia.reduce((a,s)=>a+s.duracion,0);
    
    h += `<div class="sec-title" style="margin-top:15px">${f} · ${formatMin(t)} activos · ${activasDelDia.length} ses.</div>
    <div class="log-list">${porF[f].reverse().map(s=>htmlLogItem(s)).join('')}</div>`;
  });
  return h;
}

/* ─── VISTA RESUMEN ─── */
function vistaResumen() {
  const stats = { tapon: {count:0, min:0} };
  SPECS.forEach(e => stats[e.id] = {count:0, min:0});
  
  let totalMinRehab = 0;
  let totalSesionesRehab = 0;

  sesiones.forEach(s => {
    if (s.accion === ACTION_TAPON) {
      stats.tapon.count++;
      stats.tapon.min += s.duracion;
    } else {
      if (stats[s.especId]) {
        stats[s.especId].count++;
        stats[s.especId].min += s.duracion;
      }
      totalMinRehab += s.duracion;
      totalSesionesRehab++;
    }
  });

  const maxM = Math.max(...Object.values(stats).map(v => v.min), 1);

  let h = `
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Total Sesiones</div><div class="stat-value">${totalSesionesRehab}</div><div class="stat-sub">activas</div></div>
    <div class="stat-card"><div class="stat-label">Tiempo Acumulado</div><div class="stat-value" style="color:var(--blue)">${formatMin(totalMinRehab)}</div><div class="stat-sub">activo</div></div>
  </div>
  <div class="card" style="margin-top:10px"><div class="progress-row">
    <div class="prog-item" onclick="verDetalleEspecialidad('tapon_especial')" style="cursor:pointer">
      <div class="prog-head"><div class="prog-name">⏱️ Prueba de Tapón</div><div class="prog-val" style="color:var(--green); font-weight:bold">${formatMin(stats.tapon.min)}</div></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${(stats.tapon.min/maxM)*100}%; background:var(--green)"></div></div>
    </div>`;

  SPECS.forEach(e => {
    const v = stats[e.id];
    h += `<div class="prog-item" onclick="verDetalleEspecialidad('${e.id}')" style="cursor:pointer">
      <div class="prog-head"><div class="prog-name">${e.ico} ${e.nombre}</div><div class="prog-val">${formatMin(v.min)}</div></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${(v.min/maxM)*100}%; background:${e.color}"></div></div>
    </div>`;
  });
  h += `</div></div>`;
  return h;
}

function verDetalleEspecialidad(id) {
  const cont = document.getElementById('modal-detalle-content');
  let list = [];
  if (id === 'tapon_especial') {
    document.getElementById('modal-detalle-title').textContent = "Historial: Pruebas de Tapón";
    list = sesiones.filter(s => s.accion === ACTION_TAPON);
  } else {
    const e = SPECS.find(x => x.id === id);
    document.getElementById('modal-detalle-title').textContent = "Historial: " + e.nombre;
    list = sesiones.filter(s => s.especId === id && s.accion !== ACTION_TAPON);
  }
  cont.innerHTML = list.reverse().map(s => htmlLogItem(s, true)).join('');
  openModal('modal-detalle');
}

/* ─── UTILS ─── */
function formatMin(m) {
  const h = Math.floor(m/60); const min = m%60;
  if(h===0) return min+'m';
  return h+'h'+(min>0?' '+min+'m':'');
}
function htmlLogItem(s, showDate=false) {
  const e = SPECS.find(x => x.id === s.especId) || {ico:'?', color:'#fff', nombre:'---'};
  return `<div class="log-item">
    <div class="log-ico">${s.accion === ACTION_TAPON ? '⏱️' : e.ico}</div>
    <div class="log-body">
      <div class="log-head">
        <div class="log-spec" style="color:${s.accion === ACTION_TAPON ? 'var(--green)' : e.color}">${s.accion === ACTION_TAPON ? 'Tapón' : e.nombre}</div>
        <div class="log-time">${showDate?s.fecha+' ':''}${s.hora}</div>
      </div>
      <div class="log-prof">${s.profesionales.join(', ')}</div>
      <div class="log-action">${s.accion}</div>
      <div class="log-dur">⏱ ${formatMin(s.duracion)}</div>
      ${s.notas ? `<div class="log-notes">${s.notas}</div>` : ''}
    </div>
    <button class="log-delete" onclick="borrarSesion(${s.id})">×</button>
  </div>`;
}
function keyHoy() { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function borrarSesion(id) { if(confirm('¿Eliminar?')){ sesiones=sesiones.filter(s=>s.id!==id); guardar(); render(); } }

/* ─── FORMULARIO ─── */
function abrirSelectorSpec() { openModal('modal-spec'); }
function pickSpec(id) { closeModal('modal-spec'); abrirSesion(id); }
function abrirSesion(id) {
  specActual = id; const e = SPECS.find(x => x.id === id);
  document.getElementById('modal-sesion-title').textContent = e.nombre;
  document.getElementById('prof-pills').innerHTML = profesionales[id].map(p => `<span class="pill" onclick="this.classList.toggle('sel')">${p}</span>`).join('');
  document.getElementById('action-pills').innerHTML = [...e.acciones, ...(accionesPersonalizadas[id]||[])].map(a => `<span class="pill" onclick="this.classList.toggle('sel')">${a}</span>`).join('');
  openModal('modal-sesion');
}
function selDur(el, v) { document.querySelectorAll('#dur-pills .pill').forEach(p=>p.classList.remove('sel')); el.classList.add('sel'); durActual = v; }
function guardarSesion() {
  const p = Array.from(document.querySelectorAll('#prof-pills .pill.sel')).map(x=>x.textContent);
  const a = Array.from(document.querySelectorAll('#action-pills .pill.sel')).map(x=>x.textContent);
  const d = parseInt(durActual || document.getElementById('custom-dur').value);
  if(!a.length || !d) return alert('Faltan datos');
  const s = { id:Date.now(), fecha:keyHoy(), hora:new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}), especId:specActual, profesionales:p, accion:a.join(' · '), duracion:d, notas:document.getElementById('session-notes').value };
  sesiones.push(s); guardar(); enviarNube(s); closeModal('modal-sesion'); switchTab('hoy');
}

/* ─── CONFIG ─── */
function openConfig() {
  const c = document.getElementById('config-content'); c.innerHTML = '';
  SPECS.forEach(e => {
    c.innerHTML += `<div class="cfg-spec-block"><div class="cfg-spec-title">${e.nombre}</div>
    <div class="cfg-add-row"><input id="in-${e.id}"><button onclick="addP('${e.id}')">+</button></div>
    <div>${profesionales[e.id].map((p,i)=>`<span>${p} <button onclick="delP('${e.id}',${i})">x</button></span>`).join(' ')}</div></div>`;
  });
  openModal('modal-config');
}
function addP(id){ const v = document.getElementById('in-'+id).value; if(v){profesionales[id].push(v); guardar(); openConfig();} }
function delP(id, i){ profesionales[id].splice(i,1); guardar(); openConfig(); }

cargar();
if(taponInicio) taponInterval = setInterval(updateTaponDisplay, 1000);
render();
</script>
</body>
</html>
